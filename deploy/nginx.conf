# haashemi.dev — NGINX configuration example

server {
    listen 443 ssl;
    http2 on;
    server_name haashemi.dev;

    root /var/www/haashemi;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Short links as real 307s. Keep in sync with site.urls in src/config/site.ts.
    # Without these blocks, nginx redirects /urls/<key> -> /urls/<key>/ and the
    # built-in meta-refresh pages take over.
    location = /urls/telegram {
        return 307 https://t.me/HaashemiDev;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}

server {
    listen 80;
    server_name haashemi.dev;
    return 308 https://$host$request_uri;
}
